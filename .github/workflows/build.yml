name: Windows app and independent ORACLE engine
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.1.3
      - run: python tests/native.py
      - run: python tests/engine.py
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build pure x86-64 assembly executable
        shell: cmd
        run: build.bat
      - name: Verify executable and native window
        shell: pwsh
        run: ./scripts/test-windows.ps1
      - name: Package Windows release
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fortuna-windows-x64
          path: |
            build/FebiusFortuna.exe
            build/FortunaOracle.dll
            build/FortunaOracle.lib
            build/fortuna-windows.png
            build/gui-tickets.txt
            build/imports.txt
            build/한글 경로/report.txt
            dist/*.zip
            dist/SHA256SUMS.txt
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [engine, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fortuna-windows-x64
          path: release-files
      - name: Publish verified version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          engine_version=$(tr -d '\r\n' < engine/VERSION)
          version=$(tr -d '\r\n' < VERSION)
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists; retaining immutable release."
            exit 0
          fi
          gh release create "v$version" \
            release-files/build/FortunaOracle.dll \
            "release-files/dist/FebiusFortuna-$version-windows-x64.zip" \
            "release-files/dist/FortunaOracle-Engine-$engine_version-windows-x64-sdk.zip" \
            release-files/dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Febius Fortuna $version" \
            --notes-file docs/RELEASE_NOTES.md --latest
