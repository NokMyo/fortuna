name: ORACLE engine verification
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  math:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.1.3
      - run: python tests/native.py
      - run: python tests/engine.py
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - shell: cmd
        run: build.bat
      - shell: pwsh
        run: |
          python tests/dll-windows.py
          if ($LASTEXITCODE -ne 0) { throw 'DLL tests failed' }
          $p = Start-Process build/oracle-example.exe -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Example failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: FortunaOracle-engine
          path: |
            build/FortunaOracle.dll
            build/FortunaOracle.lib
            build/FortunaOracleStatic.lib
