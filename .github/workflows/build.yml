name: Windows app with ORACLE engine folder
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.1.3
      - run: python engine/tests/native.py
      - run: python engine/tests/advanced.py
      - run: python engine/tests/integrated.py
      - run: python engine/tests/engine.py
      - run: python engine/tests/research.py
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build pure x86-64 assembly executable
        shell: cmd
        run: build.bat
      - name: Build optional engine SDK
        shell: cmd
        run: engine\build.bat sdk
      - name: Verify engine API independently of the app
        shell: pwsh
        run: |
          python engine/tests/dll-windows.py
          if ($LASTEXITCODE -ne 0) { throw 'Engine API tests failed' }
          python engine/tests/research-windows.py
          if ($LASTEXITCODE -ne 0) { throw 'Research API tests failed' }
          dumpbin /disasm engine/build/FortunaOracle.dll > build/engine-disassembly.txt
          python engine/tests/integrated-windows.py
          if ($LASTEXITCODE -ne 0) { throw 'Integrated ten-function API tests failed' }
          $p = Start-Process engine/build/oracle-example.exe -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Engine example failed' }
      - name: Verify executable and native window
        shell: pwsh
        run: ./scripts/test-windows.ps1
      - name: Package Windows release
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fortuna-windows-x64
          path: |
            build/FebiusFortuna.exe
            build/fortuna-windows.png
            build/gui-tickets.txt
            build/imports.txt
            build/engine-disassembly.txt
            build/한글 경로/report.txt
            dist/*.zip
            dist/SHA256SUMS.txt
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [engine, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fortuna-windows-x64
          path: release-files
      - name: Remove older releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(tr -d '\r\n' < VERSION)
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while IFS= read -r tag; do
            version="${tag#v}"
            if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              continue
            fi
            if [ "$version" = "$current" ]; then
              continue
            fi
            first=$(printf '%s\n%s\n' "$version" "$current" | sort -V | head -n1)
            if [ "$first" = "$version" ]; then
              gh release delete "$tag" --yes
            fi
          done
      - name: Publish verified version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '\r\n' < VERSION)
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists; retaining immutable release."
            exit 0
          fi
          gh release create "v$version" \
            "release-files/dist/FebiusFortuna-$version-windows-x64.zip" \
            release-files/dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Febius Fortuna $version" \
            --notes-file docs/RELEASE_NOTES.md --latest
